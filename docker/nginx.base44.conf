# Base44 sandbox config for this static site.
# The site is served directly from the bind-mounted repository, so file edits
# show up immediately without any build step. Workers run as root because the
# sandbox checkout is mounted with mode 0700 (owner-only) permissions.
user  root;
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen       3000;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
